# /etc/nginx/sites-available/apphong.berkatselalu.com
# Reverse proxy for the Hong Chiang Ordering System (Node on :3000)

server {
    listen 80;
    listen [::]:80;
    server_name apphong.berkatselalu.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# After `certbot --nginx -d apphong.berkatselalu.com` runs, certbot rewrites
# this file to add the :443 ssl server block automatically.
