# /etc/nginx/sites-available/quehong.berkatselalu.com
# Public mirror for the walk-in queue (landing pages + mini-PC mirror pushes).
server {
    listen 80;
    server_name quehong.berkatselalu.com;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
# After `ln -s` into sites-enabled + reload:
#   sudo certbot --nginx -d quehong.berkatselalu.com
