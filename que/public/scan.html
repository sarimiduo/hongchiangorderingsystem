<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan Antrian - Edo Sushi</title>
<style>
:root { --ground:#fff; --surface:#ebebea; --ink:#1a1a1a; --muted:#6b6b6b; --accent:#b3201f; --ok:#1d7a3c; }
* { box-sizing:border-box; margin:0; font-family:"Libre Franklin",system-ui,sans-serif; }
body { background:var(--ink); color:#fff; height:100vh; display:grid; place-items:center; text-align:center; }
.msg { padding:24px; }
.msg h1 { font-size:5vh; font-weight:800; }
.msg .num { font-size:18vh; font-weight:800; line-height:1.1; }
.msg .detail { font-size:4vh; margin-top:2vh; line-height:1.4; }
.idle { color:#9a9a98; }
.flash-seated .num, .flash-seated h1 { color:#7fe09a; }
.flash-requeued .num, .flash-requeued h1 { color:#f4d9a8; }
.flash-bad h1 { color:#ff9c9b; }
input { position:absolute; opacity:0; }
</style>
</head>
<body>
<div class="msg idle" id="msg">
  <h1>Pindai QR struk antrian Anda</h1>
  <div class="detail">Scan your queue ticket QR here</div>
</div>
<input id="in" autofocus autocomplete="off">
<script>
const inp = document.getElementById('in');
const msg = document.getElementById('msg');
let resetTimer = null;
document.addEventListener('click', () => inp.focus());
setInterval(() => inp.focus(), 2000);

function beep(ok) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = ok ? 880 : 220; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(.2, ctx.currentTime);
    o.start(); o.stop(ctx.currentTime + (ok ? .15 : .4));
  } catch (e) {}
}

async function submitScan() {
  const data = inp.value.trim(); inp.value = '';
  if (!data) return;
  const r = await fetch('/api/que/scan', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ data }),
  }).then(r => r.json()).catch(() => ({ ok: false, result: 'error', msg: 'server error' }));
  show(r);
}
let idleTimer = null;
inp.addEventListener('keydown', e => {
  if (e.key === 'Enter') { clearTimeout(idleTimer); submitScan(); }
});
// Scanners without an Enter/CR suffix: submit once the burst of keystrokes
// stops (a human cannot type a 20-char token in 400 ms, a scanner always does).
inp.addEventListener('input', () => {
  clearTimeout(idleTimer);
  if (inp.value.length >= 8) idleTimer = setTimeout(submitScan, 400);
});

function show(r) {
  clearTimeout(resetTimer);
  beep(r.ok);
  const num = r.number ? 'Q' + String(r.number).padStart(3, '0') : '';
  let head, cls;
  if (r.result === 'seated') { head = 'Silakan duduk / Please be seated'; cls = 'flash-seated'; }
  else if (r.result === 'requeued') { head = 'Masuk antrian kembali / Re-queued'; cls = 'flash-requeued'; }
  else if (r.result === 'waiting') { head = 'Mohon menunggu / Please wait'; cls = 'flash-requeued'; }
  else { head = 'QR tidak valid / Invalid QR'; cls = 'flash-bad'; }
  msg.className = 'msg ' + cls;
  msg.innerHTML = `<h1>${head}</h1>` + (num ? `<div class="num">${num}</div>` : '') +
    `<div class="detail">${r.msg || ''}</div>`;
  resetTimer = setTimeout(() => {
    msg.className = 'msg idle';
    msg.innerHTML = '<h1>Pindai QR struk antrian Anda</h1><div class="detail">Scan your queue ticket QR here</div>';
  }, 12000);
}
</script>
</body>
</html>
